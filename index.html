<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1B19" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:0}html,body{margin:0}</style>
<title>Guionero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400;1,600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: hoja de papel centrada sobre un escritorio; barra de título + cinta de herramientas fija arriba, barra de estado abajo. */
:root{
  --desk:#E8E5DE; --bar:#F5F3EE; --page:#FDFCF9; --bg:#F5F3EE; --raise:#FBFAF7;
  --fg:#2D2B27; --muted:#857F74; --faint:#B9B3A7; --line:#E2DED4; --rule:#D3CEC3; --tint:#F3F1EB; --hover:#ECE9E1;
  --accent:#2F6A9E; --accent-soft:rgba(47,106,158,.11);
  --ok:#4C8458; --warn:#B07A22; --danger:#B0473B; --overlay:rgba(45,40,32,.16);
  --paper-shadow:0 1px 2px rgba(45,40,32,.06),0 4px 18px rgba(45,40,32,.07);
  --shadow:0 10px 34px rgba(45,40,32,.13),0 1px 3px rgba(45,40,32,.08);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#131211; --bar:#1C1B19; --page:#21201E; --bg:#1C1B19; --raise:#252422;
  --fg:#DCD8CF; --muted:#8E897F; --faint:#5A564F; --line:#302E2A; --rule:#3B3934; --tint:#272623; --hover:#2C2A27;
  --accent:#80AAD3; --accent-soft:rgba(128,170,211,.14);
  --ok:#7DB389; --warn:#D3A14E; --danger:#DB7B6E; --overlay:rgba(0,0,0,.45);
  --paper-shadow:0 1px 2px rgba(0,0,0,.4),0 4px 18px rgba(0,0,0,.35);
  --shadow:0 10px 34px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#131211; --bar:#1C1B19; --page:#21201E; --bg:#1C1B19; --raise:#252422;
  --fg:#DCD8CF; --muted:#8E897F; --faint:#5A564F; --line:#302E2A; --rule:#3B3934; --tint:#272623; --hover:#2C2A27;
  --accent:#80AAD3; --accent-soft:rgba(128,170,211,.14);
  --ok:#7DB389; --warn:#D3A14E; --danger:#DB7B6E; --overlay:rgba(0,0,0,.45);
  --paper-shadow:0 1px 2px rgba(0,0,0,.4),0 4px 18px rgba(0,0,0,.35);
  --shadow:0 10px 34px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark }

html,body{height:100%}
body{background:var(--desk);color:var(--fg);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-soft)}

.chrome{transition:opacity .45s ease}
body.typing .chrome{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.chrome,.row,.drawer{transition:none!important}}

/* ---------- barra de título + cinta ---------- */
.topbar{position:fixed;inset:0 0 auto;z-index:20;background:var(--bar);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.titlebar{display:flex;align-items:center;gap:4px;height:48px;padding:0 var(--gut-r) 0 var(--gut-l)}
.crumb{min-width:0;flex:1;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:8px}
.crumb b{color:var(--fg);font-weight:500}
.ib{height:32px;min-width:32px;padding:0 8px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:13px;white-space:nowrap}
.ib:hover{background:var(--hover);color:var(--fg)}
.ib svg{width:17px;height:17px;flex:none}
.ib.txt{color:var(--fg);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--page)}
.seg button{height:26px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bar)}
.sync{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 9px;border-radius:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync:hover{background:var(--hover)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.sync[data-s="synced"] .dot{background:var(--ok)}
.sync[data-s="syncing"] .dot{background:var(--accent);animation:pulse 1s infinite alternate}
.sync[data-s="offline"] .dot,.sync[data-s="expired"] .dot{background:var(--warn)}
.sync[data-s="error"] .dot{background:var(--danger)}
@keyframes pulse{to{opacity:.3}}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;display:grid;place-items:center}

.ribbon{display:flex;align-items:center;gap:2px;height:44px;padding:0 var(--gut-r) 0 var(--gut-l);border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.ribbon::-webkit-scrollbar{display:none}
.grp{display:flex;align-items:center;gap:2px;flex:none}
.sep{width:1px;height:22px;background:var(--line);margin:0 8px;flex:none}
.tb{height:32px;min-width:32px;padding:0 7px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--fg);font-size:12.5px;flex:none;white-space:nowrap}
.tb:hover{background:var(--hover)}
.tb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tb:disabled{opacity:.35;cursor:default;background:none}
.tb svg{width:17px;height:17px;flex:none}
.tb .lbl{color:var(--fg)}
.tsel{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--page);padding:0 26px 0 9px;font-size:12.5px;outline:none;flex:none;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px;background-repeat:no-repeat}
.tsel:hover{border-color:var(--rule)}
.tsel:focus{border-color:var(--accent)}
#selFont{width:150px}#selSize{width:66px}#selStyle{width:122px}
.spacer{flex:1;min-width:8px}

/* ---------- barra de estado ---------- */
.statusbar{position:fixed;inset:auto 0 0;z-index:20;display:flex;align-items:center;gap:14px;height:calc(32px + env(safe-area-inset-bottom,0px));
  padding:0 var(--gut-r) env(safe-area-inset-bottom,0px) var(--gut-l);background:var(--bar);border-top:1px solid var(--line);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.statusbar b{font-weight:500;color:var(--fg)}
.zoom{margin-left:auto;display:flex;align-items:center;gap:4px}
.zoom button{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.zoom button:hover{background:var(--hover);color:var(--fg)}
.zoom input{width:110px;accent-color:var(--accent)}
.zoom .pct{min-width:42px;text-align:right}

/* ---------- escritorio y hoja ---------- */
.stage{position:fixed;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:calc(118px + env(safe-area-inset-top,0px)) var(--gut-r) calc(80px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.doc{--doc-font:var(--mono);--doc-size:16px;margin:0 auto;width:100%;max-width:816px;min-height:1056px;background:var(--page);box-shadow:var(--paper-shadow);border-radius:2px;
  padding:88px 96px 120px;font-family:var(--doc-font);font-size:var(--doc-size)}
.doc.av{max-width:1056px;min-height:816px;padding:64px 64px 96px}
.ta{display:block;width:100%;resize:none;border:0;background:transparent;outline:none;overflow:hidden;padding:0;font-family:inherit}
.title{font-weight:600;font-size:1.75em;line-height:1.25;letter-spacing:-.01em}
.logline{margin-top:10px;font-style:italic;font-size:.9em;line-height:1.6;color:var(--muted)}
.ta::placeholder,.cell::placeholder{color:var(--faint);opacity:1}
.meta{margin:20px 0 6px;padding-bottom:14px;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.meta span+span::before{content:"·";margin-right:14px;color:var(--faint)}

/* A/V como tabla */
.avtable{margin-top:22px;border:1px solid var(--rule);border-radius:3px}
.avhead,.row{display:grid;grid-template-columns:2.8rem minmax(0,.82fr) minmax(0,1.18fr) 4.8rem}
.avhead>div,.row>*{padding:10px 12px;border-right:1px solid var(--line)}
.avhead>div:last-child,.row>*:last-child{border-right:0}
.avhead{background:var(--tint);border-bottom:1px solid var(--rule);font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.avhead>div:last-child{text-align:right}
.row{border-bottom:1px solid var(--line);transition:opacity .35s,background .2s}
.row:last-child{border-bottom:0}
.row:focus-within{background:var(--accent-soft)}
body.typing .row:not(:focus-within){opacity:.42}
.num{font-size:.75em;color:var(--faint);padding-top:13px!important;font-variant-numeric:tabular-nums}
.row:focus-within .num{color:var(--accent)}
.cell{font-size:.97em;line-height:1.62;min-height:calc(1.62em + 20px)}
.cell.v{font-size:.87em;color:var(--muted)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dur{font-size:.75em;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
.addrow{margin-top:12px;height:38px;width:100%;border-radius:6px;color:var(--muted);font-family:var(--sans);font-size:13px;display:flex;align-items:center;justify-content:center;gap:10px;border:1px dashed var(--rule)}
.addrow:hover{color:var(--fg);border-color:var(--muted)}
kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border:1px solid var(--line);border-radius:4px;color:var(--faint)}

/* Libre */
.free{margin-top:26px;outline:none;line-height:1.7;min-height:600px;overflow-wrap:break-word}
.free:empty::before{content:attr(data-ph);color:var(--faint)}
.free h1{font-size:1.45em;font-weight:600;line-height:1.3;margin:1.3em 0 .45em}
.free h2{font-size:1.15em;font-weight:600;margin:1.2em 0 .35em}
.free p{margin:0 0 .85em}
.free blockquote{margin:0 0 .85em;padding:.1em 0 .1em 1em;border-left:3px solid var(--rule);color:var(--muted);font-size:.92em;font-style:italic}
.free ul,.free ol{margin:0 0 .85em;padding-left:1.6em}
.free li{margin:.2em 0}
.free b,.free strong{font-weight:600}

@media (max-width:820px){
  .doc,.doc.av{padding:36px 22px 64px;min-height:70vh}
  .crumb,.hide-sm{display:none!important}
  .titlebar .spacer-sm{flex:1}
}
@media (max-width:720px){
  .avhead{display:none}
  .row{grid-template-columns:2rem minmax(0,1fr)}
  .row>*{border-right:0;padding:6px 10px}
  .row .num{grid-row:1/4;border-right:1px solid var(--line)!important}
  .row .cell.v,.row .cell.n,.row .side{grid-column:2}
  .row .side{flex-direction:row;padding-bottom:10px}
  .cell.v{padding-top:12px}
  .zoom input{display:none}
}

/* ---------- cajón ---------- */
.scrim{position:fixed;inset:0;z-index:30;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .25s}
.drawer{position:fixed;z-index:31;top:0;bottom:0;left:0;width:min(340px,88vw);background:var(--raise);box-shadow:var(--shadow);
  transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) 0 calc(10px + env(safe-area-inset-bottom,0px)) env(safe-area-inset-left,0px)}
body.drawer-open .drawer{transform:none}
body.drawer-open .scrim{opacity:1;pointer-events:auto}
.dhead{display:flex;align-items:center;gap:8px;padding:4px 14px 10px}
.brand{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:-.01em;flex:1}
.brand i{font-style:normal;color:var(--accent)}
.dtabs{padding:0 14px}
.dtabs .seg{display:flex}
.dtabs .seg button{flex:1;height:30px;font-size:13px}
.search{margin:10px 14px 6px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 11px;outline:none;font-size:13px}
.search:focus{border-color:var(--faint)}
.dlist{flex:1;overflow-y:auto;padding:4px 8px 12px}
.item{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:8px}
.item:hover{background:var(--hover)}
.item[aria-current="true"]{background:var(--accent-soft)}
.item .t{font-size:13.5px;font-weight:500;color:var(--fg);line-height:1.35;display:flex;gap:8px;align-items:baseline}
.item .t span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.item .s{font-size:11.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.pend{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none;transform:translateY(-1px)}
.cat{margin-top:6px}
.cathead{width:100%;display:flex;align-items:center;gap:8px;padding:9px 10px 5px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:500}
.cathead .c{margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:0}
.cathead svg{width:11px;height:11px;transition:transform .2s}
.cat.closed .cathead svg{transform:rotate(-90deg)}
.cat.closed .ideas{display:none}
.idea{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px}
.idea:hover{background:var(--hover)}
.st{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--faint);flex:none;margin-top:2px;position:relative}
.st[data-st="guion"]{border-color:var(--accent);background:conic-gradient(var(--accent) 0 50%,transparent 0)}
.st[data-st="listo"]{border-color:var(--ok);background:var(--ok)}
.st[data-st="listo"]::after{content:"";position:absolute;left:4px;top:1.5px;width:3px;height:6px;border:solid var(--raise);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.ibody{flex:1;min-width:0;text-align:left}
.ibody .t{font-size:13px;line-height:1.4;color:var(--fg)}
.idetail{display:none;margin-top:6px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.idea.open .idetail{display:block}
.iact{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line);font-size:12px;color:var(--fg);background:var(--bg)}
.chip:hover{border-color:var(--faint)}
.chip.pri{background:var(--accent);border-color:var(--accent);color:var(--raise)}
.dfoot{display:flex;gap:6px;padding:8px 14px 0;border-top:1px solid var(--line)}
.btn{height:34px;padding:0 13px;border-radius:8px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg)}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.pri:hover{opacity:.9}
.btn.dang{color:var(--danger)}
.btn svg{width:15px;height:15px}
.empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:13px;line-height:1.55;font-family:var(--sans)}

/* ---------- menús, modales, toasts ---------- */
.menu{position:fixed;z-index:40;min-width:230px;background:var(--raise);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:13px;text-align:left}
.menu button:hover{background:var(--hover)}
.menu button.dang{color:var(--danger)}
.menu button kbd{margin-left:auto}
.menu svg{width:15px;height:15px;color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.modal-wrap{position:fixed;inset:0;z-index:50;background:var(--overlay);display:grid;place-items:center;padding:16px var(--gut-r) 16px var(--gut-l)}
.modal{width:min(480px,100%);max-height:calc(100% - 20px);overflow-y:auto;background:var(--raise);border-radius:14px;box-shadow:var(--shadow);padding:22px}
.modal h2{margin:0 0 4px;font-family:var(--mono);font-size:17px;font-weight:600}
.modal .sub{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:500;color:var(--muted)}
.inp{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 11px;outline:none;font-size:14px;width:100%}
textarea.inp{height:auto;min-height:70px;padding:9px 11px;resize:vertical;line-height:1.5}
.inp:focus{border-color:var(--accent)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;background:var(--bg)}
.pick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pick b{display:block;font-size:13.5px;font-weight:600;margin-bottom:3px}
.pick span{font-size:12px;color:var(--muted);line-height:1.4}
details.guide{margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
details.guide summary{cursor:pointer;font-size:13px;font-weight:500}
details.guide ol{margin:10px 0 2px;padding-left:20px;font-size:12.5px;line-height:1.6;color:var(--fg)}
details.guide li{margin-bottom:6px}
.mono{font-family:var(--mono);font-size:12px;background:var(--hover);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
input.mono{font-size:13px;padding:0 11px}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:6px 0 0}
.acct{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.acct .avatar{width:32px;height:32px}
.acct div{min-width:0;flex:1;font-size:13px}
.acct small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.toasts{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(46px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--fg);color:var(--bg);font-size:13px;padding:9px 14px;border-radius:9px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center}
.toast button{color:var(--bg);font-weight:600;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>

<header class="topbar chrome" id="topbar">
  <div class="titlebar">
    <button class="ib" id="btnDrawer" title="Guiones e ideas (Ctrl+\)" aria-label="Abrir guiones e ideas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <button class="ib txt" id="btnFile" aria-haspopup="menu">Archivo</button>
    <div class="crumb" id="crumb"></div>
    <div class="spacer-sm"></div>

      if(changedCurrent){const a=document.activeElement;if(!(a&&a.closest&&a.closest('#doc')))renderEditor()}
      if(changedAny)renderDrawer();
    }catch(e){if(e.code==='expired')this.setStatus('expired');else if(!navigator.onLine)this.setStatus('offline');else{this.setStatus('error','No se pudo subir ('+(e.message||'error')+'). Toca para reintentar.');console.warn(e,e.detail)}}
    finally{this.syncing=false;if(this.again){this.again=false;this.schedule()}}},
  async syncIdeas(files,folder){
    const f=files.find(x=>x.appProperties&&x.appProperties.guionero==='ideas');
    if(f){S.drive.ideasFileId=f.id;const rmt=Date.parse(f.modifiedTime);
      if(rmt>(S.drive.ideasSyncedAt||0)+1500){const d=await this.api('GET',API+'/files/'+f.id+'?alt=media');const data=typeof d==='string'?JSON.parse(d):d;
        if(data&&Array.isArray(data.ideas)){const map=new Map(S.ideas.map(i=>[i.id,i]));let changed=false;
          for(const ri of data.ideas){const li=map.get(ri.id);if(!li){S.ideas.push(ri);changed=true}else if((ri.updatedAt||0)>(li.updatedAt||0)){Object.assign(li,ri);changed=true}else if((li.updatedAt||0)>(ri.updatedAt||0))S.ideasDirty=true}
          const rids=new Set(data.ideas.map(i=>i.id));if(S.ideas.some(i=>!rids.has(i.id)))S.ideasDirty=true;
          if(changed&&document.body.classList.contains('drawer-open'))renderDrawer()}
        S.drive.ideasSyncedAt=rmt}}
    else{S.drive.ideasFileId=null;S.ideasDirty=true}
    if(S.ideasDirty){const content=JSON.stringify({format:'guionero-ideas',version:1,ideas:S.ideas});
      const meta=S.drive.ideasFileId?{name:'Banco de ideas.json'}:{name:'Banco de ideas.json',parents:[folder],mimeType:'application/json',appProperties:{guionero:'ideas'}};
      const r=await this.upload(meta,content,S.drive.ideasFileId);S.drive.ideasFileId=r.id;S.drive.ideasSyncedAt=Date.parse(r.modifiedTime);S.ideasDirty=false}}
};
window.addEventListener('online',()=>{if(Drive.token)Drive.syncNow();else if(Drive.status==='offline')Drive.setStatus('local')});
window.addEventListener('offline',()=>{if(Drive.token)Drive.setStatus('offline')});
setInterval(()=>{if(Drive.token&&Drive.status!=='syncing'){if(Object.values(S.scripts).some(s=>s.dirty)||S.ideasDirty||S.pendingDeletes.length)Drive.syncNow();else if(now()-(S.drive.lastSync||0)>60000)Drive.syncNow()}},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow();else if(Drive.token)Drive.syncNow()});
window.addEventListener('pagehide',saveNow);

/* ================= arranque ================= */
applyTheme();applyZoom();applyFocus();renderEditor();
if(S.drive.email&&S.settings.clientId)Drive.setStatus('expired','Toca para reconectar con '+S.drive.email);else Drive.setStatus('local');
if(S.settings.clientId)Drive.prepare();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/claude|anthropic|usercontent/.test(location.hostname))navigator.serviceWorker.register('./sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
</script>
